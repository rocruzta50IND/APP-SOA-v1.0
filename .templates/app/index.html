<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SOA v13.1 - Template DevTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 h-screen flex overflow-hidden">

  <aside class="w-64 bg-[#0c0c0e] border-r border-zinc-800/60 flex flex-col shrink-0 z-20">
    <div class="p-6 border-b border-zinc-800/60">
      <div class="flex items-center gap-3 text-white">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i data-lucide="layers" class="w-4 h-4 text-white"></i>
        </div>
        <h1 class="text-sm font-bold tracking-tight">SOA DevTool</h1>
      </div>
    </div>
    
    <div class="p-4 pb-0 mt-2">
      <button onclick="selectAllTemplates(this)" id="btn-all-templates" class="nav-item w-full text-left px-3 py-2.5 rounded-lg text-[13px] font-bold text-white bg-zinc-800/80 hover:bg-zinc-700 flex items-center gap-3 border border-zinc-700/50 shadow-lg mb-6 transition-all duration-300">
        <i data-lucide="sparkles" class="w-4 h-4 text-yellow-400"></i>
        <span>Todos os Templates</span>
      </button>
      
      <h2 class="text-[10px] uppercase tracking-widest font-bold text-zinc-500 mb-3 px-2">Categorias</h2>
    </div>
    
    <div class="px-4 pb-4 flex-1 overflow-y-auto">
      <nav id="categories-list" class="space-y-1"></nav>
    </div>
  </aside>

  <main class="flex-1 flex flex-col overflow-hidden relative bg-[#09090b]">
    
    <header class="h-20 px-8 border-b border-zinc-800/60 flex justify-between items-center bg-[#09090b]/95 backdrop-blur-md z-10">
      <div class="flex flex-col">
        <h2 id="current-category-title" class="text-xl font-bold tracking-tight text-white">Carregando...</h2>
        <div id="subcat-filters" class="flex gap-2 mt-2 hidden"></div>
      </div>

      <div class="relative w-72 search-focus transition-all rounded-lg border border-zinc-800 bg-[#121214]">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
        <input type="text" id="search-input" placeholder="Buscar template..." class="w-full bg-transparent text-sm text-zinc-200 placeholder-zinc-500 py-2.5 pl-10 pr-4 outline-none focus:ring-0">
      </div>
    </header>

    <section id="templates-grid" class="p-8 overflow-y-auto flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-8 content-start">
    </section>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4 sm:p-8 opacity-0 transition-opacity duration-300">
    <div class="bg-[#0c0c0e] border border-zinc-800/80 rounded-xl w-full h-full max-w-[1440px] flex flex-col shadow-2xl shadow-black overflow-hidden ring-1 ring-white/5">
      
      <div class="bg-[#18181b] border-b border-zinc-800 px-4 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4">
          <div class="flex gap-1.5 mr-2">
            <button onclick="closeModal()" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-400 transition-colors cursor-pointer flex items-center justify-center group"><i data-lucide="x" class="w-2 h-2 text-red-900 opacity-0 group-hover:opacity-100"></i></button>
            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
          </div>
          <div class="h-4 w-px bg-zinc-700"></div>
          <div>
             <h2 id="modal-title" class="text-sm font-bold text-white leading-none">Nome</h2>
             <p id="modal-desc" class="text-zinc-500 text-[10px] mt-0.5 truncate max-w-[200px]">Descrição</p>
          </div>
        </div>

        <div id="modal-tabs" class="flex gap-2"></div>
        
        <button onclick="toggleTheme()" class="flex items-center justify-center w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition-colors border border-zinc-700/50" title="Alternar Tema">
          <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="browser-frame" class="relative flex-1 bg-[#09090b] overflow-y-auto overflow-x-hidden flex flex-col items-center border-b border-zinc-800/80">
        <div id="carousel-empty" class="hidden flex-col items-center justify-center text-zinc-600 h-full w-full absolute inset-0 bg-[#09090b]">
           <i data-lucide="image-off" class="w-12 h-12 mb-4 opacity-40"></i>
           <p class="text-sm font-medium">Visualização não disponível para este tema/rota.</p>
        </div>
        <img id="preview-img" src="" class="w-full max-w-full h-auto object-top transition-opacity duration-300 shadow-xl" onerror="handleImageError()" />
      </div>

      <div class="p-4 bg-[#0c0c0e] flex justify-between items-center shrink-0">
        <button onclick="closeModal()" class="px-5 py-2.5 rounded-lg text-sm font-medium text-zinc-300 border border-zinc-700 bg-zinc-800/30 hover:text-white hover:bg-zinc-700 transition-all flex items-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar à Galeria
        </button>
        <button id="btn-confirm" onclick="confirmSelection()" class="px-8 py-2.5 rounded-lg text-sm font-bold bg-white text-black hover:bg-zinc-200 hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_20px_rgba(255,255,255,0.15)] flex items-center gap-2">
          <i data-lucide="download" class="w-4 h-4"></i> Utilizar Este Template
        </button>
      </div>

    </div>
  </div>

  <div id="success-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div id="success-card" class="bg-[#0c0c0e] border border-zinc-800 rounded-2xl p-10 flex flex-col items-center text-center shadow-2xl transform scale-95 transition-transform duration-300">
      <div class="w-20 h-20 rounded-full bg-green-500/10 flex items-center justify-center mb-6 ring-1 ring-green-500/20">
        <i data-lucide="check" class="w-10 h-10 text-green-500"></i>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Template Extraído!</h2>
      <p class="text-sm text-zinc-400 mt-2">O código fonte está pronto. Pode retornar ao seu terminal.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
